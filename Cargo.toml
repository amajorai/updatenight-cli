[package]
name = "un"
version = "0.1.0"
edition = "2021"
description = "Update Night CLI — browse AI dev tools from your terminal"
license = "MIT"
repository = "https://github.com/amajorai/updatenight-cli"

[package.metadata.binstall]
pkg-url = "https://github.com/amajorai/updatenight-cli/releases/download/v{ version }/un-{ target }.tar.gz"
bin-dir = "un{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/amajorai/updatenight-cli/releases/download/v{ version }/un-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "un"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
open = { version = "5", features = ["shellexecute-on-windows"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }
