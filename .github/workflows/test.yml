name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUST_VERSION: '1.99.0'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install ${{ env.RUST_VERSION }}
      - name: Run tests
        run: rustup run ${{ env.RUST_VERSION }} cargo test --locked
